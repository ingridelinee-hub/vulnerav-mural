<style>
  :root {
    --color-bg: #f3f2f2;
    --color-text: #201f1d;
    --color-accent-300: #d9b689;
    --color-accent-500: #b68235;
    --color-accent-700: #8a6427;
    --color-accent-900: #5e4419;
    --color-neutral-300: #c9c8c6;
    --color-neutral-400: #a8a7a5;
    --color-neutral-500: #8f8e8c;
    --color-neutral-700: #565553;
    --color-neutral-900: #201f1d;
    --color-divider: #ddd;
    --font-heading: 'Cormorant Garamond', serif;
    --font-body: 'Newsreader', serif;
    --font-ui: 'IBM Plex Sans', sans-serif;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 40px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.15);
    --radius-sm: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  a { color: var(--color-accent-700); }
  .btn { font-family: var(--font-ui); font-size: 15px; padding: var(--space-3) var(--space-5); min-height: 44px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--color-accent-500); background: transparent; color: var(--color-accent-700); }
  .btn:hover { background: color-mix(in oklch, var(--color-accent-500) 10%, transparent); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { border: none; background: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); min-height: 44px; color: var(--color-neutral-700); font-family: var(--font-ui); font-size: 13px; cursor: pointer; }
  .card { border: 1px solid var(--color-divider); background: var(--color-bg); border-radius: var(--radius-sm); }
  nav { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-divider); }
  .brand { font-family: var(--font-heading); font-size: 24px; cursor: pointer; }
  .navlinks { display: flex; gap: var(--space-5); font-family: var(--font-ui); font-size: 15px; }
  .navlinks span { cursor: pointer; padding-bottom: 2px; min-height: 44px; display: flex; align-items: center; }
  .navlinks span.active { border-bottom: 1px solid var(--color-accent-700); }
  .view { display: none; }
  .view.active { display: block; }
  .hero { position: relative; overflow: hidden; min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--space-8) var(--space-5); background: radial-gradient(ellipse 900px 480px at 50% -8%, color-mix(in oklch, var(--color-accent-500) 35%, transparent), transparent 70%), var(--color-neutral-900); }
  .paper { position: absolute; background: var(--color-bg); border-radius: 2px; background-image: repeating-linear-gradient(var(--color-neutral-900) 0 2px, transparent 2px 12px); background-blend-mode: multiply; }
  .hero-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
  .kicker { font-family: var(--font-ui); font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent-300); margin: 0 0 var(--space-4); }
  h1 { font-family: var(--font-heading); font-weight: 500; font-size: clamp(32px, 7vw, 56px); line-height: 1.15; max-width: 820px; margin: 0 0 var(--space-4); color: var(--color-bg); }
  .lead { font-family: var(--font-body); font-size: clamp(17px, 3vw, 19px); line-height: 1.7; max-width: 560px; color: var(--color-neutral-300); margin: 0 0 var(--space-6); }
  .fineprint { font-family: var(--font-ui); font-size: 13px; color: var(--color-neutral-400); margin-top: var(--space-8); max-width: 480px; }
  .care-note { font-family: var(--font-ui); font-size: 13px; color: var(--color-neutral-500); margin: var(--space-3) 0 0; }
  .mural { background: radial-gradient(ellipse 900px 480px at 50% -8%, color-mix(in oklch, var(--color-accent-500) 35%, transparent), transparent 70%), var(--color-neutral-900); min-height: 80vh; }
  .clothesline { position: relative; height: 64px; max-width: 900px; margin: 0 auto; }
  .rope { position: absolute; left: 5%; right: 5%; top: 32px; height: 1px; background: rgba(255,255,255,0.25); }
  .pin { width: 9px; height: 22px; background: linear-gradient(var(--color-accent-300), var(--color-accent-500)); border-radius: 2px; position: absolute; top: 26px; }
  .pin::before { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--color-accent-900); }
  .pin::after { content: ''; position: absolute; left: 50%; top: 10px; bottom: 0; width: 1px; background: var(--color-accent-900); transform: translateX(-50%); }
  .mural-inner { max-width: 680px; margin: 0 auto; padding: 0 var(--space-4) var(--space-8); }
  .compose { padding: var(--space-4); margin-bottom: var(--space-8); }
  .compose-kicker { font-family: var(--font-ui); font-size: 13px; color: var(--color-neutral-700); margin: 0 0 var(--space-3); }
  textarea { width: 100%; resize: vertical; border: 1px solid var(--color-divider); border-radius: var(--radius-sm); background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; padding: var(--space-3); }
  .post { padding: var(--space-5) var(--space-4); margin-bottom: var(--space-8); position: relative; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0 1px, transparent 1px 26px); }
  .post-pin { position: absolute; left: 50%; top: -11px; transform: translateX(-50%); width: 11px; height: 26px; background: linear-gradient(var(--color-accent-300), var(--color-accent-500)); border-radius: 2px; box-shadow: var(--shadow-sm); }
  .post-pin::before { content: ''; position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: var(--color-accent-900); }
  .post-pin::after { content: ''; position: absolute; left: 50%; top: 11px; bottom: 0; width: 1px; background: var(--color-accent-900); transform: translateX(-50%); }
  .post-time { font-family: var(--font-ui); font-size: 12px; color: var(--color-neutral-500); margin: 0 0 var(--space-4); }
  .post-text { font-family: var(--font-body); font-style: italic; font-size: 18px; line-height: 1.85; white-space: pre-wrap; margin: 0 0 var(--space-4); }
  .post-actions { display: flex; gap: var(--space-5); align-items: center; border-top: 1px solid var(--color-divider); padding-top: var(--space-3); }
  .post-actions button.active { color: var(--color-accent-700); }
  .comments { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-divider); display: none; flex-direction: column; gap: var(--space-3); }
  .comments.open { display: flex; }
  .comment { font-family: var(--font-body); font-size: 16px; line-height: 1.6; color: var(--color-neutral-700); margin: 0; padding-left: var(--space-3); border-left: 2px solid var(--color-divider); }
  .comment-row { display: flex; gap: var(--space-2); }
  .comment-row input { flex: 1; min-height: 44px; border: 1px solid var(--color-divider); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-family: var(--font-body); font-size: 15px; }
  footer { border-top: 1px solid var(--color-divider); padding: var(--space-4) var(--space-6); text-align: center; font-family: var(--font-ui); font-size: 12px; color: var(--color-neutral-500); }
  @media (max-width: 640px) {
    .hero { min-height: 80vh; padding: var(--space-6) var(--space-4); }
    .mural-inner { padding: 0 var(--space-3) var(--space-8); }
    .post-actions { gap: var(--space-3); flex-wrap: wrap; }
  }
</style>
